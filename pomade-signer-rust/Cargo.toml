[package]
name = "pomade-signer"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
frost-taproot = { path = "../frost-taproot-rust" }
nostr = { version = "0.44", features = ["std", "nip98"] }
log = "0.4"
env_logger = "0.11"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tower-layer = "0.3"
tower-service = "0.3"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }
argon2 = "0.5"

[dev-dependencies]
tempfile = "3"
